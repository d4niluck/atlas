[package]
name = "atlas-llama-probe"
version = "0.1.0"
edition = "2021"
[features]
test-hook=[]
[dependencies]
serde_json = "1"
base64 = "0.21"
sha2 = "0.10"

libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[[bin]]
name = "fake_model"
path = "tests/fixtures/fake_model.rs"
required-features = ["test-hook"]
