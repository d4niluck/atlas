[package]
name = "atlas-native-storage-contract"
version = "0.1.0"
edition = "2021"
[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "modern_sqlite"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }
docx-lite = "0.2"
sha2 = "0.10"
libc = "0.2"

[features]
test-hook=[]
