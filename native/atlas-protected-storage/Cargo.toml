[package]
name="atlas-sqlcipher-proof"
version="0.1.0"
edition="2021"
[dependencies]
atlas-native-storage-contract={path="../atlas-native-storage"}
rusqlite={version="=0.41.1",features=["bundled-sqlcipher-vendored-openssl","modern_sqlite","blob","backup"]}
serde_json="1"
atlas-faiss-probe={path="../atlas-faiss-rust"}
tiny_http="0.12"
url="2"
pdf-extract="0.12.1"
docx-lite="0.2"
zip={version="0.6",default-features=false,features=["deflate"]}
uuid={version="1",features=["v4"]}
libc="0.2"
sha2="0.10"

[features]
agent-write=["owner-leases","atlas-native-storage-contract/agent-write"]
agent-upload=["atlas-native-storage-contract/agent-upload"]
owner-leases=["atlas-native-storage-contract/owner-leases"]
test-hook=["atlas-native-storage-contract/test-hook"]
